# openapi.yaml
# What:  The API the frontend expects (mandate Section 4). Build the backend to match it, and
#        the frontend can switch from placeholder data by setting VITE_USE_MOCK_DATA=false.
# Used by: the backend developer; frontend services/*.service.js follow it exactly.
# Rules: every answer uses the same envelope; every list is paginated; errors never expose internals.
openapi: 3.0.3
info:
  title: NIT Sikkim Creative Park API
  version: 1.0.0
  description: Public read endpoints plus one write endpoint (contact messages).
servers:
  - url: /api/v1

paths:
  /projects:
    get:
      summary: Student projects
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: category
          in: query
          description: Leave out for all categories.
          schema: { type: string, enum: [tech, robotics, creative] }
      responses:
        '200': { $ref: '#/components/responses/ProjectList' }
        '400': { $ref: '#/components/responses/Error' }
  /events:
    get:
      summary: Scheduled events
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
        - name: category
          in: query
          description: Leave out for all categories.
          schema: { type: string, enum: [tech, hackathon, robotics, culture, sports] }
      responses:
        '200': { $ref: '#/components/responses/EventList' }
        '400': { $ref: '#/components/responses/Error' }
  /alumni:
    get:
      summary: Alumni directory
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/AlumniList' }
  /companies:
    get:
      summary: Recruitment partners
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/CompanyList' }
  /placement-stats:
    get:
      summary: Latest headline placement figures
      responses:
        '200': { $ref: '#/components/responses/PlacementStats' }
  /fests:
    get:
      summary: The annual fests
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/FestList' }
  /fests/featured:
    get:
      summary: The spotlight fest. "data" is null when none is promoted.
      responses:
        '200': { $ref: '#/components/responses/FeaturedFest' }
  /competencies:
    get:
      summary: Skill-strength cards for the events page
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200': { $ref: '#/components/responses/CompetencyList' }
  /metrics/overview:
    get:
      summary: The four homepage counters
      responses:
        '200': { $ref: '#/components/responses/OverviewStats' }
  /metrics/campus:
    get:
      summary: Everything on the metrics page
      responses:
        '200': { $ref: '#/components/responses/CampusMetrics' }
  /contact-messages:
    post:
      summary: Send a message from the contact form
      description: Validate every field on the server. Rate-limit by IP (mandate Section 6).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactMessageInput' }
      responses:
        '201': { $ref: '#/components/responses/Created' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }

components:
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      description: Items per page. Reject values above 100.
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }

  responses:
    Error:
      description: Failure. "code" is stable for code to check; "message" is safe to show people.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorEnvelope' }
    Created:
      description: Message accepted.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EmptyEnvelope' }
    ProjectList:
      description: One page of projects.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProjectListEnvelope' }
    EventList:
      description: One page of events.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EventListEnvelope' }
    AlumniList:
      description: One page of alumni.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AlumniListEnvelope' }
    CompanyList:
      description: One page of companies.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CompanyListEnvelope' }
    PlacementStats:
      description: Placement figures.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/PlacementStatsEnvelope' }
    FestList:
      description: One page of fests.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FestListEnvelope' }
    FeaturedFest:
      description: The spotlight fest, or null.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/FeaturedFestEnvelope' }
    CompetencyList:
      description: One page of competencies.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CompetencyListEnvelope' }
    OverviewStats:
      description: Homepage counters.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OverviewStatsEnvelope' }
    CampusMetrics:
      description: Metrics page data.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/CampusMetricsEnvelope' }

  schemas:
    # ---- envelopes (every answer has this shape) ----
    ErrorEnvelope:
      type: object
      required: [success, data, error, requestId]
      properties:
        success: { type: boolean, enum: [false] }
        data: { nullable: true, enum: [null] }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message: { type: string, example: Please check the email address. }
        requestId: { type: string }
    EmptyEnvelope:
      type: object
      required: [success, data, error, requestId]
      properties:
        success: { type: boolean, enum: [true] }
        data: { nullable: true, enum: [null] }
        error: { nullable: true, enum: [null] }
        requestId: { type: string }
    ProjectListEnvelope: { $ref: '#/components/schemas/Page' }
    EventListEnvelope: { $ref: '#/components/schemas/Page' }
    AlumniListEnvelope: { $ref: '#/components/schemas/Page' }
    CompanyListEnvelope: { $ref: '#/components/schemas/Page' }
    FestListEnvelope: { $ref: '#/components/schemas/Page' }
    CompetencyListEnvelope: { $ref: '#/components/schemas/Page' }
    PlacementStatsEnvelope: { $ref: '#/components/schemas/Page' }
    FeaturedFestEnvelope: { $ref: '#/components/schemas/Page' }
    OverviewStatsEnvelope: { $ref: '#/components/schemas/Page' }
    CampusMetricsEnvelope: { $ref: '#/components/schemas/Page' }
    Page:
      description: >
        Success envelope. For list endpoints "data" is
        { items: [...], page, limit, total }. For single objects it is the object itself.
        Item shapes are in the schemas below, matching frontend/src/services/mocks/*.mock.js.
      type: object
      required: [success, data, error, requestId]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object, nullable: true }
        error: { nullable: true, enum: [null] }
        requestId: { type: string }

    # ---- item shapes ----
    Project:
      type: object
      required: [id, title, club, category, description, progress, stack, status]
      properties:
        id: { type: string }
        title: { type: string }
        club: { type: string }
        category: { type: string, enum: [tech, robotics, creative] }
        description: { type: string }
        progress: { type: integer, minimum: 0, maximum: 100 }
        stack: { type: array, items: { type: string } }
        status: { type: string }
    Event:
      type: object
      required: [id, title, category, kind, accent, startDate, description, tags, organizer, action]
      properties:
        id: { type: string }
        title: { type: string }
        category: { type: string, enum: [tech, hackathon, robotics, culture, sports] }
        kind: { type: string }
        accent: { type: string, enum: [cyan, purple, emerald, amber] }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date, nullable: true }
        description: { type: string }
        tags: { type: array, items: { type: string } }
        organizer: { type: string }
        action:
          type: object
          required: [label, variant]
          properties:
            label: { type: string }
            variant: { type: string, enum: [primary, ghost] }
            url: { type: string, format: uri, nullable: true, description: null means "coming soon" }
    Alumnus:
      type: object
      required: [id, name, classYear, role, company, branch, location, bio, linkedinUrl]
      properties:
        id: { type: string }
        name: { type: string }
        classYear: { type: integer }
        role: { type: string }
        company: { type: string }
        branch: { type: string }
        location: { type: string }
        bio: { type: string }
        linkedinUrl: { type: string, format: uri }
    Company:
      type: object
      required: [id, name, logoPath]
      properties:
        id: { type: string }
        name: { type: string }
        logoPath: { type: string, description: SVG path data for a 24x24 icon. }
    ContactMessageInput:
      type: object
      required: [name, email, subject, message]
      properties:
        name: { type: string, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        skills: { type: array, items: { type: string } }
        subject:
          type: string
          enum: [PROJECT_COLLABORATION, CAMPUS_RECRUITMENT, RESEARCH_PARTNERSHIP, ALUMNI_NETWORKING, SYSTEM_FEEDBACK]
        message: { type: string, maxLength: 2000 }
