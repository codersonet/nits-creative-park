<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <!--
      404.html
      What:  GitHub Pages shows this file for any address it does not have a file for, such as
             /clubs. The script turns "/nitsikkim-creatives/clubs" into
             "/nitsikkim-creatives/?/clubs" and opens the app, where spa-redirect.js restores it.
      Note:  "segmentsToKeep" is 1 because the site lives in a project folder
             (/nitsikkim-creatives/). Set it to 0 if the site is served from the domain root.
      Only used on GitHub Pages. The Nginx container handles this itself (infra/nginx/frontend.conf).
    -->
    <script>
      var segmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
