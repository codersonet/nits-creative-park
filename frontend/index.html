<!doctype html>
<html lang="en">
  <!--
    index.html
    What:     The single HTML page the React app mounts into.
    Used by:  Vite (dev server and build)
    Talks to: src/main.jsx, public/spa-redirect.js (GitHub Pages deep links)
    Note:     __SITE_URL__ is replaced by vite.config.js. Page titles and descriptions
              are set per route by the SEO component.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIT Sikkim - Creative_Park</title>
    <meta
      name="description"
      content="Explore NIT Sikkim student clubs, engineering projects, events, recruitment partners, and the alumni network in one creative hub."
    />
    <meta name="author" content="NIT Sikkim Creative Park" />
    <meta name="theme-color" content="#131313" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="format-detection" content="telephone=no" />

    <script src="/spa-redirect.js"></script>
    <link rel="canonical" href="__SITE_URL__/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NIT Sikkim Creative Park" />
    <meta property="og:title" content="NIT Sikkim Creative Park" />
    <meta
      property="og:description"
      content="The hub for NIT Sikkim engineering clubs, innovation projects, events, students, and alumni."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:image" content="__SITE_URL__/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="NIT Sikkim Creative Park: clubs, projects, alumni, and events" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NIT Sikkim Creative Park" />
    <meta
      name="twitter:description"
      content="The hub for NIT Sikkim engineering clubs, innovation projects, events, students, and alumni."
    />
    <meta name="twitter:image" content="__SITE_URL__/social-preview.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "NIT Sikkim Creative Park",
        "url": "__SITE_URL__/",
        "description": "A creative hub for NIT Sikkim engineering clubs, innovation projects, events, students, and alumni.",
        "parentOrganization": {
          "@type": "CollegeOrUniversity",
          "name": "National Institute of Technology Sikkim",
          "alternateName": "NIT Sikkim"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This site needs JavaScript enabled to show clubs, events and alumni.</noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
