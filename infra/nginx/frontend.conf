# infra/nginx/frontend.conf
# What:  Nginx settings for the frontend container (copied in by frontend/Dockerfile).
# Used by: frontend/Dockerfile -> /etc/nginx/conf.d/default.conf
# Talks to: the built files in /usr/share/nginx/html
# Note:  Port 8080 because the unprivileged image does not run as root.
#        Add HSTS (Strict-Transport-Security) at the HTTPS layer in front of this container.

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # --- Security headers (mandate Section 6) ---
  # WHY at server level only: a location block that has its own add_header would drop these.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # style-src needs 'unsafe-inline' only because React sets style="width: 72%" on progress bars.
  # img-src allows Unsplash, where some content pictures are still hosted.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

  # --- Speed ---
  gzip on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/manifest+json;

  # Used by Docker's health check. Nothing is logged for it.
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Built files have a fingerprint in their name, so browsers may keep them for a year.
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # The page shell must always be re-checked, otherwise visitors would miss new releases.
  location = /index.html {
    expires -1;
  }

  # Never serve hidden files such as .env or .git.
  location ~ /\. {
    deny all;
  }

  # Any other address belongs to the app, so the app's router decides what to show.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
