# docker-compose.yml
# What:  Starts the project locally with one command:  docker compose up --build
#        Then open http://localhost:8080
# Now:   Only the frontend exists. Add the backend, database and cache services here
#        when the backend is built (mandate Section 11).
# Needs: frontend/package-lock.json (run `npm install` in frontend/ once).

services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-http://localhost:8080}
        VITE_BASE_PATH: /
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_USE_MOCK_DATA: ${VITE_USE_MOCK_DATA:-true}
    ports:
      - "8080:8080"
    # Least privilege: no extra powers, no writing to the container's files except /tmp.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
